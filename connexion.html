<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e5aa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EEB-ONG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<title>Connexion - EEB-ONG</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
/* Fond #dde1e7, ombres douces, textes bleu et orange */
:root{--bleu:#1e5aa8;--orange:#f28c28;--bg:#dde1e7;--shadow-dark:#a3b1c6;--shadow-light:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-size:13px;font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--bleu)}
body:has(nav){padding-top:80px}
h1,h2{color:var(--bleu)} h1{font-size:1.4rem} h2{font-size:1.2rem;border-bottom:3px solid var(--orange);padding-bottom:6px}
main{max-width:900px;margin:auto;padding:20px}
.logo{max-width:100%;height:auto}
.centre{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo-grand{width:min(80vw,420px)}
a{color:var(--orange);font-weight:bold}
form{display:grid;gap:12px}
input,select,button,textarea,table,.btn{font-family:inherit;transition:color .2s, box-shadow .2s;box-shadow:4px 4px 6px var(--shadow-dark), -4px -4px 6px var(--shadow-light)}
input,select,textarea{padding:10px;font-size:.9rem;border:none;border-radius:8px;background:var(--bg);color:var(--bleu)}
button,.btn{background:var(--orange);color:#fff;border:none;cursor:pointer;border-radius:8px;padding:10px 16px;text-decoration:none;display:inline-block;font-size:.9rem}
button:hover,.btn:hover{box-shadow:inset 2px 2px 4px rgba(0,0,0,.25), inset -2px -2px 4px rgba(255,255,255,.2)}
table{width:100%;border-collapse:collapse;margin-top:12px;background:var(--bg);border-radius:8px;overflow:hidden}
th{background:var(--bleu);color:#fff} th,td{border:1px solid #c5cad2;padding:8px;text-align:left}
.erreur{color:#c00}
/* Navbar : fixée en haut à gauche, 60% de la largeur, sans trait orange */
nav{position:fixed;top:0;left:0;width:60%;border-radius:0 0 14px 0;background:var(--bg);display:flex;justify-content:space-around;z-index:10;transition:box-shadow .2s;box-shadow:0 4px 6px var(--shadow-dark)}
.item{position:relative;text-align:center;padding:6px 4px;font-size:.75rem}
.item>a{display:block;text-decoration:none;color:var(--bleu)} .item span{font-size:1.2rem;display:block}
.menu{display:none;position:absolute;top:100%;left:0;background:var(--bg);border:1px solid var(--orange);min-width:140px;box-shadow:4px 4px 6px var(--shadow-dark), -4px -4px 6px var(--shadow-light)}
.item:hover .menu,.item:focus-within .menu{display:block}
.menu a{display:block;padding:8px;text-decoration:none;color:var(--bleu)}
.entete-page{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--orange);margin:16px 0}
.entete-page h1,.entete-page h2{border:none;margin:0 0 6px;padding:0}
.recherche{width:45%;max-width:260px;margin-bottom:6px}
.logo-moyen{position:fixed;top:6px;right:12px;width:80px;z-index:9}
@media print{nav,.noprint{display:none} body{background:#fff;padding-top:0!important} *{box-shadow:none!important}}
/* Connexion : champs plus larges + bouton œil */
.centre form,.centre #verif{width:min(92vw,420px)}
.centre input,.centre select{font-size:1rem;padding:14px}
.champ-mdp{position:relative}
.champ-mdp input{width:100%;padding-right:52px}
#voirMdp{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;box-shadow:none;color:var(--bleu);padding:8px;display:flex;align-items:center}
#voirMdp:hover{box-shadow:none;color:var(--orange)}
.lien-petit{color:var(--bleu);font-size:.75rem;font-weight:normal}
</style>
</head>
<body data-page="connexion">

<main>
<div class="centre"><img class="logo" width="140" alt="Logo">
<h1>Connexion</h1>
<form id="formConnexion"><input type="email" id="email" placeholder="Adresse mail" required>
<div class="champ-mdp"><input type="password" id="mdp" placeholder="Mot de passe" required><button type="button" id="voirMdp" aria-label="Afficher le mot de passe"></button></div>
<button>Se connecter</button><p id="msg" class="erreur"></p></form>
<div id="verif" style="display:none"><p>Compte inactif depuis plus d'un an : vérifiez votre numéro de téléphone.</p>
<form onsubmit="return false"><input id="telVerif" type="tel" placeholder="Numéro de téléphone du compte">
<button type="button" id="envoyerCode">Envoyer le code</button>
<input id="codeVerif" placeholder="Code reçu">
<button type="button" id="validerCode">Vérifier et déverrouiller</button><p id="msgVerif" class="erreur"></p></form></div>
<p><a href="#" id="mdpOublie" class="lien-petit">Mettre à jour mon mot de passe</a></p>
<p>Pas de compte ? <a href="inscription.html">Créer un compte</a></p>
<p><a href="#" id="reinitSite" class="lien-petit" style="opacity:.6">Effacer les données de cet appareil</a></p></div>
</main>
<script type="module" src="firebase-init.js"></script>
</body></html>
